<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; frame-src https://www.youtube-nocookie.com; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IMFAHE">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta name="twitter:card" content="summary_large_image">
$head_links
  <link rel="icon" href="$base/assets/images/site-icon-48.png" sizes="48x48" type="image/png">
  <link rel="icon" href="$base/assets/images/site-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="$base/assets/images/site-icon-192.png">
  <link rel="preload" href="$base/assets/fonts/noto-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="$base/assets/site.css?v=$css_version">
  <script defer src="$base/assets/site.js?v=$js_version"></script>
</head>
<body id="top">
  <a class="skip-link" href="#main-content">$skip</a>
$header
  <main id="main-content">
$content
  </main>
$footer
$consent
</body>
</html>
